name: CI Pipeline

on:
  push:
    branches: [master, main, staging]
  pull_request:
    branches: [master, main, staging]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9'
  SONAR_PROJECT_KEY: PedroHCastelani_GameIdle
  SONAR_ORGANIZATION: pedro-castelani

jobs:
  # ============================================================
  # JOB 1: LINT
  # ============================================================
  lint:
    name: 🔍 Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🔍 Run ESLint
        run: pnpm lint

      - name: ✅ Lint passed
        run: echo "✅ Lint check passed!"

  # ============================================================
  # JOB 2: TYPECHECK
  # ============================================================
  typecheck:
    name: 🏷️ TypeCheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🏷️ Run TypeScript type check
        run: pnpm typecheck

      - name: ✅ TypeCheck passed
        run: echo "✅ TypeCheck passed!"

  # ============================================================
  # JOB 3: TEST
  # ============================================================
  test:
    name: 🧪 Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🧪 Run tests
        run: pnpm test
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          REDIS_URL: redis://localhost:6379

      - name: ✅ Tests passed
        run: echo "✅ All tests passed!"

  # ============================================================
  # JOB 4: BUILD
  # ============================================================
  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint, typecheck, test]
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🏗️ Build all apps
        run: pnpm build
        env:
          NODE_ENV: production

      - name: ✅ Build passed
        run: echo "✅ Build completed successfully!"

  # ============================================================
  # JOB 5: SONARCLOUD
  # ============================================================
  sonarcloud:
    name: 📈 SonarCloud
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint, typecheck, test, build]

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📈 Run SonarCloud analysis
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ env.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION: ${{ env.SONAR_ORGANIZATION }}

      - name: 🚦 Check SonarCloud Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ============================================================
  # JOB 6: SUMMARY
  # ============================================================
  summary:
    name: 📊 CI Summary
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, build, sonarcloud]
    if: always()
    
    steps:
      - name: 📊 Check all jobs status
        run: |
          echo "=========================================="
          echo "📊 CI Pipeline Summary"
          echo "=========================================="
          echo "Lint: ${{ needs.lint.result }}"
          echo "TypeCheck: ${{ needs.typecheck.result }}"
          echo "Test: ${{ needs.test.result }}"
          echo "Build: ${{ needs.build.result }}"
          echo "SonarCloud: ${{ needs.sonarcloud.result }}"
          echo "=========================================="
          
          if [[ "${{ needs.lint.result }}" != "success" ]] || \
             [[ "${{ needs.typecheck.result }}" != "success" ]] || \
             [[ "${{ needs.test.result }}" != "success" ]] || \
             [[ "${{ needs.build.result }}" != "success" ]] || \
             [[ "${{ needs.sonarcloud.result }}" != "success" ]]; then
            echo "❌ CI Pipeline FAILED"
            exit 1
          fi
          
          echo "✅ CI Pipeline PASSED"

name: CI Pipeline
on:
  push:
    branches: [master, staging]
  pull_request:
    branches: [master, staging]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gameidle_test
          POSTGRES_PASSWORD: local_test_only
          POSTGRES_DB: gameidle_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U gameidle_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://gameidle_test:local_test_only@localhost:5432/gameidle_test
      DIRECT_URL: postgresql://gameidle_test:local_test_only@localhost:5432/gameidle_test
      REDIS_URL: redis://localhost:6379
      RUN_DB_TESTS: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm --filter @the-life/api test:coverage
      - run: pnpm --filter @the-life/web test:coverage
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          path: |
            apps/api/coverage/lcov.info
            apps/web/coverage/lcov.info
          if-no-files-found: error
  sonarcloud:
    name: SonarCloud
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: api-coverage
          path: apps
      - name: Require Sonar configuration
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: test -n "$SONAR_TOKEN"
      - uses: SonarSource/sonarqube-scan-action@2f77a1ec69fb1d595b06f35ab27e97605bdef703 # v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - uses: SonarSource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa # v1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

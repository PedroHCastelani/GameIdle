version: '3.9'

services:
  # ============================================================
  # PostgreSQL 16 — Banco principal
  # ============================================================
  postgres:
    image: postgres:16-alpine
    container_name: the-life-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-thelife}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-thelife_dev_2026}
      POSTGRES_DB: ${POSTGRES_DB:-the_life}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-thelife} -d ${POSTGRES_DB:-the_life}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - the-life-network

  # ============================================================
  # Redis 7 — Cache + Filas BullMQ
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: the-life-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - the-life-network

  # ============================================================
  # PgBouncer — Pool de conexões PostgreSQL
  # ============================================================
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: the-life-pgbouncer
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-thelife}:${POSTGRES_PASSWORD:-thelife_dev_2026}@postgres:5432/${POSTGRES_DB:-the_life}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 100
      MAX_DB_CONNECTIONS: 20
    ports:
      - "${PGBOUNCER_PORT:-6432}:5432"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 5432"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - the-life-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  the-life-network:
    driver: bridge
